
plugins {
    id 'base'
}

group = 'org.example'
version = '1.0.0'

// Copy HTML, CSS and images
tasks.register('buildWebsite', Copy) {
    from 'src/main/resources/static'
    into layout.buildDirectory.dir('website')
}

// Package website into ZIP
tasks.register('packageWebsite', Zip) {
    dependsOn tasks.named('buildWebsite')

    from layout.buildDirectory.dir('website')
    archiveFileName = 'tourism-website.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
}

// Build and package website
tasks.named('build') {
    dependsOn tasks.named('packageWebsite')
}
